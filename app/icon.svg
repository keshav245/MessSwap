<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Drop shadow for the outer logo background -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Linear gradient for the right orange arrow -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c96b" />
      <stop offset="100%" stop-color="#eca04a" />
    </linearGradient>
  </defs>

  <!-- Outer White Circle with Shadow -->
  <circle cx="250" cy="250" r="230" fill="#ffffff" filter="url(#shadow)" />

  <!-- Concentric Border Rings -->
  <!-- Middle thick light blue ring -->
  <circle cx="250" cy="250" r="205" fill="none" stroke="#64a4c2" stroke-width="28" />
  <!-- Outer thin dark blue ring -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#3d81a1" stroke-width="4" />
  <!-- Inner thin dark blue ring -->
  <circle cx="250" cy="250" r="192" fill="none" stroke="#3d81a1" stroke-width="4" />

  <!-- ========================================== -->
  <!-- INTERLOCKING ARROWS (INFINITY LOOP)        -->
  <!-- ========================================== -->

  <!-- Left Blue Loop -->
  <!-- Starts hidden under the orange arrowhead and ends at the top right -->
  <path d="M 250 335 C 150 335 120 310 120 250 C 120 190 150 165 250 165" 
        fill="none" stroke="#4a99be" stroke-width="22" stroke-linecap="butt" />

  <!-- Right Orange Loop -->
  <!-- Starts hidden under the blue arrowhead and ends at the bottom left -->
  <path d="M 250 165 C 350 165 380 190 380 250 C 380 310 350 335 250 335" 
        fill="none" stroke="url(#orangeGrad)" stroke-width="22" stroke-linecap="butt" />

  <!-- Blue Arrowhead (Top, pointing right) -->
  <polygon points="248,135 305,165 248,195" fill="#4a99be" />

  <!-- Orange Arrowhead (Bottom, pointing left) -->
  <polygon points="252,305 195,335 252,365" fill="url(#orangeGrad)" />

  <!-- ========================================== -->
  <!-- CENTER FOOD ICONS                          -->
  <!-- ========================================== -->

  <!-- Plate (Center-right background) -->
  <!-- Outer Solid -->
  <circle cx="250" cy="250" r="45" fill="#efa950" />
  <!-- Inner Cutout (White) -->
  <circle cx="250" cy="250" r="34" fill="#ffffff" />
  <!-- Inner Solid -->
  <circle cx="250" cy="250" r="30" fill="#efa950" />

  <!-- Fork (Right of Plate) -->
  <g fill="#efa950">
    <!-- Tines -->
    <rect x="300" y="195" width="4" height="25" rx="2" />
    <rect x="307" y="195" width="4" height="25" rx="2" />
    <rect x="314" y="195" width="4" height="25" rx="2" />
    <!-- Tine Base -->
    <path d="M 300 215 L 318 215 C 318 230 300 230 300 215 Z" />
    <!-- Handle -->
    <rect x="306" y="225" width="6" height="70" rx="3" />
  </g>

  <!-- Spoon (Far Right) -->
  <g fill="#efa950">
    <!-- Handle -->
    <rect x="332" y="225" width="6" height="70" rx="3" />
    <!-- Bowl -->
    <ellipse cx="335" cy="208" rx="10" ry="15" />
  </g>

  <!-- Bowl (Left) -->
  <!-- Includes a white stroke to cleanly separate it from the plate behind it -->
  <path d="M 165 255 L 235 255 A 35 40 0 0 1 165 255 Z" 
        fill="#efa950" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

  <!-- Tray (Base supporting the food icons) -->
  <!-- Drawn last to perfectly cover the bottom edges and bowl stroke -->
  <g fill="#efa950">
    <!-- Main Tray Board -->
    <rect x="155" y="295" width="190" height="10" rx="5" />
    <!-- Left Stand -->
    <rect x="175" y="300" width="12" height="10" rx="3" />
    <!-- Right Stand -->
    <rect x="313" y="300" width="12" height="10" rx="3" />
  </g>

</svg>
